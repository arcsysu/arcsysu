<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="../favicon.ico">

<title>Join lab</title>

<!-- ===== Font Upgrade ===== -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">

<style>

/* ===== Base Typography ===== */
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  max-width: 920px;
  margin: 0 auto;
  padding: 0 20px;
  background: #fafafa;
  color: #1f2328;
  line-height: 1.75;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

/* ===== Desktop Layout ===== */
@media (min-width: 1025px) {
  body {
    margin-right: 240px;
  }
}

/* ===== Header ===== */
h1 {
  text-align: center;
  margin-top: 36px;
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.subtitle {
  text-align: center;
  color: #6a737d;
  margin-bottom: 28px;
  font-size: 15px;
}

/* ===== Controls ===== */
.controls {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(12px);
  padding: 10px 0;
  text-align: center;
  border-bottom: 1px solid #eee;
}

/* ===== Buttons / Input ===== */
button, input {
  padding: 6px 14px;
  margin: 4px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 10px;
  font-size: 13.5px;
  transition: all 0.2s ease;
}

button:hover {
  background: #f3f6ff;
  border-color: #c9d8ff;
}

input:focus {
  outline: none;
  border-color: #1f6feb;
}

/* ===== FAQ Card ===== */
.faq-item {
  background: white;
  border: 1px solid #e6e6e6;
  border-radius: 14px;
  margin-bottom: 16px;
  padding: 18px 20px;
  transition: all 0.25s ease;
}

.faq-item:hover {
  box-shadow: 0 10px 28px rgba(0,0,0,0.06);
  transform: translateY(-2px);
}

/* ===== Question ===== */
.question {
  cursor: pointer;
  font-weight: 600;
  font-size: 15.5px;
  display: flex;
  justify-content: space-between;
  line-height: 1.5;
}

.qtag {
  color: #1f6feb;
  margin-right: 6px;
  font-weight: 600;
}

/* ===== Answer ===== */
.answer {
  display: none;
  margin-top: 14px;
  border-top: 1px dashed #eee;
  padding-top: 14px;

  font-family: "Source Serif 4", Georgia, serif;
  font-size: 15px;
  line-height: 1.8;
  color: #333;
  white-space: pre-line;
}

/* ===== Inline Code Style ===== */
.answer code {
  background: #f6f8fa;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 13px;
  font-family: "SFMono-Regular", Consolas, monospace;
}

/* ===== Highlight ===== */
.answer b {
  font-weight: 500;
}

/* ===== Arrow ===== */
.arrow {
  transition: transform 0.25s ease;
  color: #888;
}

.open .arrow {
  transform: rotate(90deg);
}

/* ===== TOC ===== */
#toc {
  position: fixed;
  right: 24px;
  top: 120px;
  width: 200px;
  max-height: 70vh;
  overflow-y: auto;
  font-size: 13px;
  padding-right: 4px;
  opacity: 0.75;
}

#toc:hover {
  opacity: 1;
}

#toc a {
  display: block;
  padding: 6px 10px;
  color: #666;
  text-decoration: none;
  border-radius: 8px;
  line-height: 1.4;
  transition: all 0.2s;
}

#toc a:hover {
  background: #f2f6ff;
  color: #1f6feb;
}

#toc a.active {
  background: #e6f0ff;
  color: #1f6feb;
  font-weight: 500;
}

/* ===== Responsive ===== */
@media (max-width: 1024px) {
  #toc { display: none; }
}

@media (max-width: 768px) {
  body { padding: 0 14px; }

  h1 {
    font-size: 26px;
  }

  input {
    width: 140px !important;
  }
}

</style>
</head>

<body>

<h1>Join arcSYSu</h1>
<div class="subtitle">We build systems that matter. From ideas → designs → impacts.
</div>

<div class="controls">
  <button id="langBtn" onclick="toggleLang()">English</button>
  <button id="expandBtn" onclick="toggleExpand()">展开全部 / Expand All</button>
  <input id="searchBox" placeholder="Search..." oninput="searchFAQ()" style="width:180px;">
</div>

<div id="faq"></div>
<div id="toc"></div>

<script>

/* ===== Data unchanged ===== */
const data = [

{
q_zh:`可否先介绍下lab？`,
a_zh:`lab名称为arcSYSu，全称是"ARChitecture and SYStem Upscaling @ SYSU"，也是“arcSYSu refines computing system uses”的递归缩写；
简称为ARX，可理解为<b><u>AR</u></b>chitecture and system e<b><u>X</u></b>ploration，或，<b><u>A</u></b>rchitecture <b><u>R</u></b>esearch led by <b><u>X</u></b>ianwei。

arcSYSu是国家超算广州中心（广州超算）下属研究组，研究聚焦GPU系统、编译技术、HPC/AI Infra及基础软件框架，致力于面向HPC/AI等关键场景构建高性能、高扩展、高实用的系统能力。
lab成员是直接接受xianweiz指导的学生（包括与其他老师共同指导学生）。

arcSYSu也是广州超算交叉研究中心（xRC）的一部分，与中心系统方向及其他方向老师的研究组在项目、论文、指导等各方面保持紧密协作。

☆ 注：arcSYSu是<a href="https://xianweiz.github.io/">xianweiz</a>指导的研究小组（research group），不代表超算中心或学院的官方研究团队或大组结构。`,

q_en:`Can you briefly introduce the lab?`,
a_en:`<b>arcSYSu</b> (ARChitecture and SYStem Upscaling @ SYSU), also known as <b>ARX</b>, is a research group led by <a href="https://xianweiz.github.io/">Xianwei</a>. The name also forms a recursive acronym: “arcSYSu refines computing system uses.”

We focus on GPU systems, compilers, HPC/AI infrastructure, and system software frameworks. Members are students directly advised (or co-advised) by Xianwei.
arcSYSu is also part of the Interdisciplinary Research Center (<b>xRC</b>), with close collaboration across groups in projects, publications, and mentoring.

☆ Note: arcSYSu is an independent research group, not a formal organizational unit.`
},

{
q_zh:`能简单谈一谈你的研究方向吗？`,
a_zh:`主要研究方向是计算机系统、GPU、编译等，关注如何围绕前沿高性能（HPC）和智能应用（AI/LLM/Agent）需求来设计和优化计算机系统以提升整体性能与可用性；
此外，lab涉及其他研究方向也包括HPC应用及AI等，会更多偏向于算法和业务，但又基本都涉及到系统层面。

- 分析应用程序，确定性能瓶颈；
- 设计软件或硬件层面解决方案；
- 实现并验证方案有效性。

常用工具是profiler（e.g.，nvprof/rocprof）、clang/LLVM、CUDA/ROCm Runtime、docker/container、K8s、vLLM/SGLang等；
常用语言是C/C++, Python, Bash, CUDA/HIP/OpenCL等。

☆ 当前重点：Agent时代的智能计算系统，涵盖：CPU/GPU、编译运行时、系统平台与应用优化等。`,

q_en:`What are your research directions?`,
a_en:`We work on computer systems, GPU architectures, and compilers, with an emphasis on optimizing systems for HPC and modern AI workloads (LLMs, agents, etc.).

Our typical workflow is, Application → System Design → Back to Application:
Analyze workloads and identify bottlenecks;
Design system/software/hardware optimizations;
Implement and validate improvements.

We also explore HPC applications and AI workloads, often spanning both systems and algorithms.

Typical tools and stack: profilers (nvprof/rocprof), LLVM/Clang, CUDA/ROCm, containers/K8s, and LLM frameworks (e.g., vLLM, SGLang).
Common languages: C/C++, Python, Bash, CUDA/HIP/OpenCL.

☆ Current focus areas: GPU systems, compilers, ML systems, HPC platforms, and application acceleration.`
},

{
q_zh:`你的方向是不是很“硬件”？`,
a_zh:`我们的研究虽接近硬件，但主要以“软件”的方法研究“软硬件”系统和应用性能优化，强调从“算法-软件-硬件”全栈知识体系和技能，但通常并不会涉及底层实现和电路。

组内重点关注的学术会议包括：SC/ASPLOS/HPCA/ISCA/MICRO/PPoPP/SOSP/OSDI/CGO/NeurlIPS/AAAI/ICLR等。`,

q_en:`Is your research hardware-oriented?`,
a_en:`Not exactly.

Representative conferences to follow include:
SC, ASPLOS, HPCA, ISCA, MICRO, PPoPP, SOSP, OSDI, CGO, NeurIPS, AAAI, ICLR.`

q_zh:`你招学生最看重哪些方面？`,

q_zh:`具体来讲，你会怎么指导学生？`,

/* ===== State ===== */
let lang = "zh";
let expanded = false;
let filtered = [...data];

/* ===== Short Title ===== */
function getShortTitle(text){
  let t = text.replace(/\n/g, " ").trim();
  t = t.replace(/吗|？|\?/g,"")
       .replace(/^你|^能|^如何|^怎么|^对/g,"")
       .trim();
  return t.length > 24 ? t.slice(0,24) + "..." : t;
}

/* ===== Render ===== */
function render(){
  const c = document.getElementById("faq");
  const toc = document.getElementById("toc");

  c.innerHTML = "";
  toc.innerHTML = "";

  filtered.forEach((d,i)=>{
    const q = lang==="zh"?d.q_zh:d.q_en;
    const a = lang==="zh"?d.a_zh:d.a_en;

    const div = document.createElement("div");
    div.className="faq-item";
    div.id="q"+i;

    div.innerHTML=`
      <div class="question" onclick="toggle(${i})">
        <div><span class="qtag">Q${i}:</span>${q}</div>
        <span class="arrow">▶</span>
      </div>
      <div class="answer" id="a${i}">${a}</div>
    `;

    c.appendChild(div);

    const link = document.createElement("a");
    link.href = "#q"+i;
    link.innerText = `Q${i} ${getShortTitle(q)}`;
    toc.appendChild(link);
  });
}

/* ===== Toggle ===== */
function toggle(i){
  const a=document.getElementById("a"+i);
  const p=a.parentElement;

  if(a.style.display==="block"){
    a.style.display="none";
    p.classList.remove("open");
  }else{
    a.style.display="block";
    p.classList.add("open");
  }
}

/* ===== Lang ===== */
function toggleLang(){
  lang = lang==="zh"?"en":"zh";
  render();
  updateButtons();
}

/* ===== Expand ===== */
function toggleExpand(){
  expanded=!expanded;

  document.querySelectorAll(".answer").forEach(a=>{
    a.style.display = expanded?"block":"none";
    a.parentElement.classList.toggle("open",expanded);
  });

  updateButtons();
}

/* ===== Buttons ===== */
function updateButtons(){
  document.getElementById("langBtn").innerText =
    lang==="zh"?"English":"中文";

  document.getElementById("expandBtn").innerText =
    expanded?"折叠全部 / Collapse All":"展开全部 / Expand All";
}

/* ===== Search ===== */
function searchFAQ(){
  const k=document.getElementById("searchBox").value.toLowerCase();

  filtered = data.filter(d=>
    d.q_zh.toLowerCase().includes(k) ||
    d.a_zh.toLowerCase().includes(k) ||
    d.q_en.toLowerCase().includes(k) ||
    d.a_en.toLowerCase().includes(k)
  );

  render();
}

/* ===== Scroll Spy ===== */
window.addEventListener("scroll", ()=>{
  let current="";
  document.querySelectorAll(".faq-item").forEach(el=>{
    if(window.scrollY >= el.offsetTop-120){
      current = el.id;
    }
  });

  document.querySelectorAll("#toc a").forEach(a=>{
    a.classList.remove("active");
    if(a.getAttribute("href")==="#"+current){
      a.classList.add("active");
    }
  });
});

render();
updateButtons();

</script>

</body>
