<!-- Publications Sidebar Navigation -->
<nav class="pub-side-nav" id="pub-sidebar">
  <!-- 收纳按钮（小屏幕时显示） -->
  <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle navigation">
    <span class="toggle-icon">&lt;</span>
  </button>
  
  <!-- 侧边栏内容 -->
  <ul id="sidebar-content">
    <li>
      <a href="#" title="Jump to top" class="sidebar-top">
        <span class="generic-icon">↑</span>
      </a>
    </li>
    <!-- Year links will be dynamically generated by JavaScript -->
  </ul>
</nav>

<style>
/* Publications Sidebar Navigation */
nav.pub-side-nav { 
  position: fixed;
  right: 30px; 
  top: 50%;
  transform: translateY(-50%);
  margin: 0px; 
  padding: 0px; 
  z-index: 100;
  pointer-events: auto;
}

nav.pub-side-nav .icon { 
  border: 0px; 
  width: 16px; 
  height: 16px; 
  padding: 2px; 
}

nav.pub-side-nav .generic-icon { 
  display: block; 
  width: 20px; 
  text-align: center;
  color: #5b6870; 
  font-weight: 800; 
  font-size: 16px;
}

nav.pub-side-nav a { 
  text-decoration: none; 
  color: #5b6870; 
}

nav.pub-side-nav a:hover { 
  text-decoration: none; 
}

nav.pub-side-nav > ul { 
  list-style: none; 
  white-space: nowrap; 
  background: #e8e8e8;
  margin: 0px; 
  padding: 8px 2px 8px 4px;
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  opacity: 1;
  transform: none;
}

nav.pub-side-nav > ul > li:hover { 
  background: #f5f5f5; 
}

nav.pub-side-nav > ul > li { 
  border-right: 8px solid #e8e8e8; 
  list-style-type: none;
  padding: 4px 2px;
  transition: all 0.2s ease;
}

nav.pub-side-nav > ul > li.underline { 
  border-bottom: 1px solid #c0c0c0; 
}

nav.pub-side-nav > ul > li.year-link { 
  border-right-color: #057234; 
}

nav.pub-side-nav > ul > li.year-link:hover {
  border-right-color: #066b32;
}

nav.pub-side-nav > ul > li.year-link.active {
  background: #d0e8f5;
  border-right-color: #066b32;
}

nav.pub-side-nav .year-text {
  display: block;
  width: 40px;
  text-align: center;
  color: #333;
  font-weight: 600;
  font-size: 11px;
  line-height: 1.2;
}

/* 收纳按钮样式 - 默认隐藏 */
.sidebar-toggle {
  display: none;
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  background: #057234;
  color: white;
  border: none;
  border-radius: 2px 0 0 2px;
  padding: 6px 3px;
  cursor: pointer;
  box-shadow: -1px 0 4px rgba(0,0,0,0.1);
  transition: transform 0.3s ease, background 0.3s ease;
  z-index: 99;
  width: 18px;
  height: 32px;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.sidebar-toggle:hover {
  background: #057234;
}

.sidebar-toggle .toggle-icon {
  font-size: 12px;
  font-weight: bold;
  display: block;
  transition: all 0.3s ease;
  line-height: 1;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

/* 响应式设计 */
@media (max-width: 1400px) {
  nav.pub-side-nav {
    right: 10px;
  }
}

@media (max-width: 1285px) {
  /* 显示收纳按钮 */
  .sidebar-toggle {
    display: flex;
  }
  
  /* 调整侧边栏容器 */
  nav.pub-side-nav {
    right: 0;
    position: fixed;
    pointer-events: none;
    top: 50%;
    transform: translateY(-50%);
  }
  
  /* 默认隐藏侧边栏内容 */
  nav.pub-side-nav > ul {
    display: none;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%) translateX(100%);
    pointer-events: auto;
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
  }
  
  /* 按钮始终可点击 */
  .sidebar-toggle {
    pointer-events: auto;
  }
  
  /* 展开状态 - 先显示再动画 */
  nav.pub-side-nav.expanded > ul {
    display: block;
  }
  
  /* 延迟应用动画，避免闪烁 */
  nav.pub-side-nav.expanded.animating > ul {
    transform: translateY(-50%) translateX(0);
    opacity: 1;
  }
  
  /* 展开时按钮图标变为关闭符号 */
  nav.pub-side-nav.expanded .sidebar-toggle .toggle-icon::after {
    content: '>';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 12px;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  
  nav.pub-side-nav.expanded .sidebar-toggle .toggle-icon {
    font-size: 0;
    position: relative;
  }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(100%);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@media (max-width: 768px) {
  /* 超小屏幕完全隐藏 */
  nav.pub-side-nav {
    display: none;
  }
}
</style>

<script>
(function() {
  'use strict';
  
  // 获取当前激活的 tab 中的所有年份
  function getYearsInTab(tabId) {
    const tab = document.querySelector(tabId);
    if (!tab) return [];
    
    const yearHeadings = tab.querySelectorAll('h4');
    const years = [];
    
    yearHeadings.forEach(heading => {
      const yearText = heading.textContent.trim();
      if (/^\d{4}$/.test(yearText)) {
        years.push(yearText);
      }
    });
    
    return years.sort((a, b) => b - a); // 降序排列
  }
  
  // 更新侧边栏
  function updateSidebar(tabId) {
    const sidebar = document.getElementById('pub-sidebar');
    if (!sidebar) return;
    
    const ul = document.getElementById('sidebar-content');
    const years = getYearsInTab(tabId);
    
    // 清空现有的年份链接（保留顶部按钮）
    const topLink = ul.querySelector('li:first-child');
    ul.innerHTML = '';
    if (topLink) ul.appendChild(topLink);
    
    // 如果没有年份，隐藏侧边栏
    if (years.length === 0) {
      sidebar.style.display = 'none';
      return;
    }
    
    sidebar.style.display = 'block';
    
    // 切换标签页时自动收起侧边栏（小屏幕）
    if (window.innerWidth <= 1285) {
      sidebar.classList.remove('animating');
      sidebar.classList.remove('expanded');
      const toggleBtn = document.getElementById('sidebar-toggle');
      if (toggleBtn) {
        toggleBtn.style.transform = 'translateY(-50%)';
      }
    }
    
    // 添加年份链接
    years.forEach((year, index) => {
      const li = document.createElement('li');
      li.className = 'year-link' + (index === years.length - 1 ? '' : ' underline');
      
      const a = document.createElement('a');
      a.href = '#';
      a.title = `Jump to ${year}`;
      a.dataset.year = year;
      a.dataset.tab = tabId;
      
      const span = document.createElement('span');
      span.className = 'year-text';
      span.textContent = year;
      
      a.appendChild(span);
      li.appendChild(a);
      ul.appendChild(li);
      
      // 点击事件
      a.addEventListener('click', function(e) {
        e.preventDefault();
        scrollToYear(year, tabId);
        
        // 更新激活状态
        ul.querySelectorAll('li.year-link').forEach(item => {
          item.classList.remove('active');
        });
        li.classList.add('active');
        
        
      });
    });
    
    // 添加底部按钮
    const bottomLi = document.createElement('li');
    bottomLi.className = 'underline';
    const bottomA = document.createElement('a');
    bottomA.href = '#';
    bottomA.title = 'Jump to bottom';
    const bottomSpan = document.createElement('span');
    bottomSpan.className = 'generic-icon';
    bottomSpan.textContent = '↓';
    bottomA.appendChild(bottomSpan);
    bottomLi.appendChild(bottomA);
    ul.appendChild(bottomLi);
    
    bottomA.addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
      
      // 不自动收起侧边栏，让用户手动控制
    });
  }
  
  // 滚动到指定年份
  function scrollToYear(year, tabId) {
    const tab = document.querySelector(tabId);
    if (!tab) return;
    
    const yearHeadings = tab.querySelectorAll('h4');
    
    for (let heading of yearHeadings) {
      if (heading.textContent.trim() === year) {
        const yOffset = -100; // 偏移量，避免被顶部导航遮挡
        const y = heading.getBoundingClientRect().top + window.pageYOffset + yOffset;
        
        window.scrollTo({
          top: y,
          behavior: 'smooth'
        });
        break;
      }
    }
  }
  
  // 顶部按钮点击事件
  function initTopButton() {
    const sidebar = document.getElementById('pub-sidebar');
    if (!sidebar) return;
    
    const topBtn = sidebar.querySelector('.sidebar-top');
    if (topBtn) {
      topBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
        
        // 不自动收起侧边栏，让用户手动控制
      });
    }
  }
  
  // 初始化收纳按钮
  function initToggleButton() {
    const sidebar = document.getElementById('pub-sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle');
    const sidebarContent = document.getElementById('sidebar-content');
    
    if (!sidebar || !toggleBtn) return;
    
    toggleBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      
      const isExpanded = sidebar.classList.contains('expanded');
      
      if (isExpanded) {
        // 收起：先移除动画类，再移除展开类
        sidebar.classList.remove('animating');
        setTimeout(() => {
          sidebar.classList.remove('expanded');
          toggleBtn.style.transform = 'translateY(-50%)';
        }, 300);
      } else {
        // 展开：先添加展开类，再触发动画
        sidebar.classList.add('expanded');
        
        // 强制重排以触发动画
        void sidebarContent.offsetWidth;
        
        // 添加动画类并计算按钮位置
        requestAnimationFrame(() => {
          sidebar.classList.add('animating');
          
          if (sidebarContent) {
            // 等待动画开始后再计算，确保侧边栏已经滑入视图
            setTimeout(() => {
              const sidebarWidth = sidebarContent.offsetWidth;
              const gap = 2; // 间隙
              // 按钮应该移动到侧边栏左侧：侧边栏宽度 + 间隙
              toggleBtn.style.transform = `translateY(-50%) translateX(-${sidebarWidth + gap}px)`;
              console.log(` 侧边栏宽度: ${sidebarWidth}px, 按钮向左移动: ${sidebarWidth + gap}px`);
            }, 100);
          }
        });
      }
    });
    
    // 点击页面其他地方关闭侧边栏
    document.addEventListener('click', function(e) {
      if (sidebar.classList.contains('expanded') && 
          !sidebar.contains(e.target)) {
        sidebar.classList.remove('animating');
        setTimeout(() => {
          sidebar.classList.remove('expanded');
        }, 300);
        toggleBtn.style.transform = 'translateY(-50%)';
      }
    });
    
    // 阻止侧边栏内部点击事件冒泡
    if (sidebarContent) {
      sidebarContent.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    }
  }
  
  // 初始化
  function init() {
    // 等待 DOM 加载完成
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
      return;
    }
    
    initTopButton();
    initToggleButton();
    
    // 初始加载时更新侧边栏（默认是 selected tab）
    const activeTab = document.querySelector('.tab-pane.active');
    if (activeTab) {
      updateSidebar('#' + activeTab.id);
    }
    
    // 监听 tab 切换
    const tabButtons = document.querySelectorAll('.tab-nav .button');
    tabButtons.forEach(button => {
      button.addEventListener('click', function() {
        // 等待 tab 切换动画完成
        setTimeout(() => {
          const activeTab = document.querySelector('.tab-pane.active');
          if (activeTab) {
            updateSidebar('#' + activeTab.id);
          }
        }, 100);
      });
    });
    
    // 监听滚动，高亮当前年份
    let ticking = false;
    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(function() {
          highlightCurrentYear();
          ticking = false;
        });
        ticking = true;
      }
    });
  }
  
  // 高亮当前可见的年份
  function highlightCurrentYear() {
    const sidebar = document.getElementById('pub-sidebar');
    if (!sidebar || sidebar.style.display === 'none') return;
    
    const activeTab = document.querySelector('.tab-pane.active');
    if (!activeTab) return;
    
    const yearHeadings = activeTab.querySelectorAll('h4');
    const yearLinks = sidebar.querySelectorAll('li.year-link');
    
    if (yearLinks.length === 0) return;
    
    let currentYear = null;
    const scrollPos = window.scrollY + 150; // 偏移量
    
    // 找到当前滚动位置对应的年份
    yearHeadings.forEach(heading => {
      const yearText = heading.textContent.trim();
      if (/^\d{4}$/.test(yearText)) {
        const headingTop = heading.offsetTop;
        if (scrollPos >= headingTop) {
          currentYear = yearText;
        }
      }
    });
    
    // 更新高亮状态
    yearLinks.forEach(link => {
      const linkYear = link.querySelector('a').dataset.year;
      if (linkYear === currentYear) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  }
  
  // 启动
  init();
})();
</script>
