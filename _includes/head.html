<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  
  <script src="{{ '/js/jquery.min.js' | relative_url }}"></script>
  <script src="{{ '/js/bootstrap.min.js' | relative_url }}"></script>

  <!-- Publications selector and search box -->
  <script src="{{ '/js/custom.js' | relative_url }}"></script>

  
  <!-- Join page FAQ script (conditional load) -->
  {% if page.layout == 'join' %}
  <script src="{{ '/js/join.js' | relative_url }}"></script>
  {% endif %}
  
{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

</head>
